# 云桥 Linux WebUI - Nginx 反代配置示例（HTTPS + SSE）
# 注意：SSE 实时推送必须关闭 proxy_buffering，否则界面收不到中转状态更新
# 用法：复制到 /etc/nginx/sites-enabled/ 并替换域名/证书路径

# HTTP → HTTPS 跳转
server {
    listen 80;
    server_name arm.oauth.eu.cc;            # ← 改成你的域名

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;              # acme.sh 验证目录
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS 反代到 WebUI
server {
    listen 443 ssl;
    server_name arm.oauth.eu.cc;            # ← 改成你的域名

    ssl_certificate     /home/ubuntu/.acme.sh/arm.oauth.eu.cc_ecc/fullchain.cer;
    ssl_certificate_key /home/ubuntu/.acme.sh/arm.oauth.eu.cc_ecc/arm.oauth.eu.cc.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    # ⚠️ 关键：SSE（Server-Sent Events）必须关缓冲，否则实时推送被 nginx 卡住
    proxy_buffering off;
    proxy_cache off;

    location / {
        proxy_pass http://127.0.0.1:8081;   # ← WebUI 实际端口
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;           # SSE 长连接
    }
}
